name: CI

# B3-4 (Beta 3): verificación multiplataforma de la suite de tests.
# Linux se ejecuta de forma nativa; FreeBSD dentro de una VM. El workflow
# solo ejecuta tests: no publica artefactos, no construye paquetes y no
# ejecuta comandos de red contra el repositorio.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # Plugin de los tests asíncronos de la UI (presente en el venv local).
          python -m pip install pytest-asyncio
          python -m pip install -e .

      - name: Run tests
        run: python -m pytest -q

  freebsd:
    name: FreeBSD ${{ matrix.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        release: ['14.2', '13.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests on FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          usesh: true
          prepare: |
            pkg install -y python311 py311-pip
          run: |
            python3.11 -m venv .venv
            . .venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
            python -m pip install pytest-asyncio
            python -m pip install -e .
            python -m pytest -q
